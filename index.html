<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biz ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>



<main class="container">

<div class="apology-banner">
  BEN Bİ MALIM<br>
  ÖZÜR DİLERİM<br>
  KARIMI ÇOK SEVİYOM ❤️
</div>

  <section class="hero">
    <h1 class="main-title">Karım da Karım ❤️</h1>
    <div class="heart">❤️</div>

    <div style="clear:both"></div><img class="big-wife-photo" src="WhatsApp Image 2026-06-24 at 08.27.33.jpeg" alt="Karım">

  </section>

  <section class="card">

    <div id="photos" class="tab-content active">
      <p class="gallery-intro">uğruna savaşlarda savaşırdım ama 2026'da imkân buna yetiyo</p>

      <div class="film-reel" id="filmReel">
        <div class="reel-sprockets reel-sprockets-top"></div>
        <div class="reel-viewfinder"></div>
        <div class="reel-track" id="reelTrack"></div>
        <div class="reel-sprockets reel-sprockets-bottom"></div>

        <button class="reel-arrow reel-arrow-left" id="reelPrev" aria-label="Önceki">‹</button>
        <button class="reel-arrow reel-arrow-right" id="reelNext" aria-label="Sonraki">›</button>
      </div>
      <p class="reel-message" id="reelMessage"></p>
    </div>

  </section>

</main>

<div class="modal" id="modal" onclick="closePhoto()">
  <span class="close">×</span>
  <span class="modal-nav modal-prev" onclick="event.stopPropagation(); prevPhoto()">‹</span>
  <span class="modal-nav modal-next" onclick="event.stopPropagation(); nextPhoto()">›</span>
  <div class="modal-frame" onclick="event.stopPropagation()">
    <img id="modalImg" />
    <div class="modal-caption" id="modalCaption"></div>
  </div>
</div>

<script>
  function showTab(tabId, button) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    button.classList.add('active');
  }



  /* ===== Anılarımız (our memories) — film makarası =====
     To add a new photo: drop the image file in this folder, then add
     one line below: { src: "filename.jpg" } */
  const photos = [
    { src: "PHOTO-2026-01-30-17-17-19.jpg" },
    { src: "PHOTO-2026-02-02-17-50-55.jpg" },
    { src: "PHOTO-2026-02-02-18-06-12.jpg" },
    { src: "PHOTO-2026-02-14-17-08-03.jpg" },
    { src: "PHOTO-2026-02-16-14-35-28.jpg" },
    { src: "WhatsApp Image 2026-07-02 at 00.43.57.jpeg" },
    { src: "WhatsApp Image 2026-07-02 at 00.46.01.jpeg" },
    { src: "WhatsApp Image 2026-07-02 at 01.09.39.jpeg" },
    { src: "PHOTO-2026-01-15-21-53-36.jpg" },
  ];

  /* word revealed per reel position — builds up as you advance */
  const reelWords = ["Seni", "her", "şeyinle", "çok", "seviyorum", "sen", "benim", "irmik", "helvamsın"];

  let activeIndex = 0;
  let currentPhoto = 0;
  const reelTrack = document.getElementById("reelTrack");
  const reelMessage = document.getElementById("reelMessage");

  function updateMessage() {
    reelMessage.innerHTML = reelWords
      .slice(0, activeIndex + 1)
      .map((w, i) => {
        if (i === activeIndex) {
          // newest word pours in letter by letter, like it's being written
          const letters = w
            .split("")
            .map((ch, li) => `<span class="reel-letter" style="animation-delay:${li * 0.09}s">${ch === " " ? "&nbsp;" : ch}</span>`)
            .join("");
          return `<span class="reel-word reel-word-new">${letters}</span>`;
        }
        return `<span class="reel-word">${w}</span>`;
      })
      .join(" ");
  }

  function renderReel() {
    reelTrack.innerHTML = photos.map((p, i) => `
      <div class="reel-frame" data-i="${i}">
        <img src="${p.src}" alt="anı fotoğrafı" loading="lazy" draggable="false">
      </div>
    `).join("");

    reelTrack.querySelectorAll(".reel-frame").forEach(frame => {
      frame.addEventListener("click", () => {
        const i = Number(frame.dataset.i);
        if (i === activeIndex) openPhoto(i);
        else goTo(i);
      });
    });

    layoutReel();
  }

  function layoutReel() {
    reelTrack.querySelectorAll(".reel-frame").forEach((f, i) => {
      const offset = i - activeIndex;
      const abs = Math.abs(offset);
      const spacing = window.innerWidth <= 600 ? 155 : 230;
      const scale = Math.max(0.5, 1 - abs * 0.2);
      const translateX = offset * spacing;
      const rotateY = Math.max(-38, Math.min(38, offset * -26));
      const opacity = abs > 3 ? 0 : Math.max(0.2, 1 - abs * 0.3);
      f.style.transform = `translateX(${translateX}px) scale(${scale}) rotateY(${rotateY}deg)`;
      f.style.opacity = opacity;
      f.style.zIndex = 50 - abs;
      f.classList.toggle("reel-active", offset === 0);
    });
    updateMessage();
  }

  function goTo(i) {
    activeIndex = Math.max(0, Math.min(photos.length - 1, i));
    layoutReel();
  }

  document.getElementById("reelPrev").addEventListener("click", () => goTo(activeIndex - 1));
  document.getElementById("reelNext").addEventListener("click", () => goTo(activeIndex + 1));

  /* drag / swipe the reel like a real film spool */
  (function () {
    const reel = document.getElementById("filmReel");
    let dragging = false, startX = 0, moved = 0;

    function down(e) {
      dragging = true;
      moved = 0;
      startX = e.touches ? e.touches[0].clientX : e.clientX;
      reel.classList.add("grabbing");
    }
    function move(e) {
      if (!dragging) return;
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      moved = x - startX;
    }
    function up() {
      if (!dragging) return;
      dragging = false;
      reel.classList.remove("grabbing");
      if (Math.abs(moved) > 40) {
        const steps = Math.round(-moved / 90) || (moved < 0 ? 1 : -1);
        goTo(activeIndex + steps);
      }
      moved = 0;
    }
    reel.addEventListener("mousedown", down);
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
    reel.addEventListener("touchstart", down, { passive: true });
    window.addEventListener("touchmove", move, { passive: true });
    window.addEventListener("touchend", up);

    reel.addEventListener("wheel", (e) => {
      e.preventDefault();
      if (Math.abs(e.deltaY) > 15 || Math.abs(e.deltaX) > 15) {
        goTo(activeIndex + (e.deltaY + e.deltaX > 0 ? 1 : -1));
      }
    }, { passive: false });
  })();

  function showPhoto(i) {
    currentPhoto = (i + photos.length) % photos.length;
    document.getElementById("modalImg").src = photos[currentPhoto].src;
    document.getElementById("modalCaption").style.display = "none";
  }

  function openPhoto(i) {
    showPhoto(i);
    activeIndex = i;
    layoutReel();
    document.getElementById("modal").style.display = "flex";
  }

  function closePhoto() {
    document.getElementById("modal").style.display = "none";
  }

  function nextPhoto() { showPhoto(currentPhoto + 1); activeIndex = currentPhoto; layoutReel(); }
  function prevPhoto() { showPhoto(currentPhoto - 1); activeIndex = currentPhoto; layoutReel(); }

  document.addEventListener("keydown", (e) => {
    if (document.getElementById("modal").style.display === "flex") {
      if (e.key === "ArrowRight") nextPhoto();
      if (e.key === "ArrowLeft") prevPhoto();
      if (e.key === "Escape") closePhoto();
    } else {
      if (e.key === "ArrowRight") goTo(activeIndex + 1);
      if (e.key === "ArrowLeft") goTo(activeIndex - 1);
    }
  });

  renderReel();
</script>


<script>
setInterval(() => {
  const heart = document.createElement("div");
  heart.innerText = "❤️";
  heart.className = "heart-bg";
  heart.style.left = Math.random()*100 + "vw";
  heart.style.fontSize = (15 + Math.random()*25) + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}, 400);
</script>

</body>

</html>
