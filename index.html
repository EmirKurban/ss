<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biz ❤️</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>



<main class="container">

<div class="apology-banner">
  BEN Bİ MALIM<br>
  ÖZÜR DİLERİM<br>
  KARIMI ÇOK SEVİYOM ❤️
</div>

  <section class="hero">
    <h1 class="main-title">Karım da Karım ❤️</h1>
    <div class="heart">❤️</div>

    <img class="big-wife-photo" src="WhatsApp Image 2026-06-24 at 08.27.33.jpeg" alt="Karım">

  </section>

  <section class="card">
    <div class="tabs">
      <button class="tab active" onclick="showTab('photos', this)">Fotoğraflarımız</button>
      <button class="secret-tab" onclick="showTab('love', this)" aria-label="Gizli mesaj"></button>
    </div>

    <div id="photos" class="tab-content active">
      <div class="gallery">
        <img src="PHOTO-2026-01-15-21-53-36.jpg" onclick="openPhoto(this.src)">
        <img src="PHOTO-2026-01-30-17-17-19.jpg" onclick="openPhoto(this.src)">
        <img src="PHOTO-2026-02-02-17-50-55.jpg" onclick="openPhoto(this.src)">
        <img src="PHOTO-2026-02-02-18-06-12.jpg" onclick="openPhoto(this.src)">
        <img src="PHOTO-2026-02-14-17-08-03.jpg" onclick="openPhoto(this.src)">
        <img src="PHOTO-2026-02-16-14-35-28.jpg" onclick="openPhoto(this.src)">
      </div>
    </div>

    <div id="love" class="tab-content">
      <div class="love-message">Seni çok seviyorum ❤️</div>
    </div>
  </section>
</main>

<div class="modal" id="modal" onclick="closePhoto()">
  <span class="close">×</span>
  <img id="modalImg" />
</div>

<script>
  function showTab(tabId, button) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    button.classList.add('active');
  }

  function openPhoto(src) {
    document.getElementById("modalImg").src = src;
    document.getElementById("modal").style.display = "flex";
  }

  function closePhoto() {
    document.getElementById("modal").style.display = "none";
  }
</script>


<script>
setInterval(() => {
  const heart = document.createElement("div");
  heart.innerText = "❤️";
  heart.className = "heart-bg";
  heart.style.left = Math.random()*100 + "vw";
  heart.style.fontSize = (15 + Math.random()*25) + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}, 400);
</script>
</body>

</html>
